[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "koies-process-mining"
version = "0.1.0"
description = "Local-first process mining platform skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "backend/app",
    "scripts/generate_synthetic_events.py",
    "scripts/benchmark_dfg.py",
]
